services:
  game:
    build: .
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - BOTS_PER_WORLD=${BOTS_PER_WORLD:-5}   # server-driven filler bots per world (0 disables)
      - YANDEX_GAME_SECRET=${YANDEX_GAME_SECRET:-}   # Yandex Games player-signature secret (optional)
      - YANDEX_VERIFY_SIG=${YANDEX_VERIFY_SIG:-0}    # 1 = strictly verify Yandex player signatures
    volumes:
      - ./data:/app/data          # SQLite (game.db) — метрики баланса
      - ./balance:/app/balance    # balance.json — правится на хосте, применяется на лету
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
