<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" font-family="'DejaVu Sans','Arial',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2fae55"/>
      <stop offset="60%" stop-color="#1e8a44"/>
      <stop offset="100%" stop-color="#0f3f22"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe79a"/><stop offset="100%" stop-color="#e39a24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="150" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <!-- slime silhouette behind (the "farm" creature) -->
  <g transform="translate(256,318)">
    <ellipse rx="150" ry="128" fill="#0f3f22" opacity="0.55"/>
    <ellipse cx="-52" cy="-8" rx="26" ry="26" fill="#eafff0" opacity="0.85"/>
    <ellipse cx="52" cy="-8" rx="26" ry="26" fill="#eafff0" opacity="0.85"/>
    <circle cx="-46" cy="-4" r="12" fill="#0d1f14"/><circle cx="58" cy="-4" r="12" fill="#0d1f14"/>
  </g>

  <!-- crossed swords (the "clash") -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="150" y1="360" x2="360" y2="150" stroke-width="34"/>
    <line x1="362" y1="360" x2="152" y2="150" stroke-width="34"/>
  </g>
  <g fill="#dff7e6">
    <circle cx="150" cy="362" r="20"/><circle cx="362" cy="362" r="20"/>
  </g>

  <!-- gold coin accent -->
  <g transform="translate(392,150)" filter="url(#glow)">
    <circle r="40" fill="url(#coin)"/><circle r="40" fill="none" stroke="#fff4cf" stroke-width="5" opacity="0.6"/>
    <circle r="20" fill="none" stroke="#c9821c" stroke-width="7"/>
  </g>
</svg>
