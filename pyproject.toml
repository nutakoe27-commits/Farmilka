[project]
name = "photo-service"
version = "0.1.0"
description = "Self-hosted photo generation API and an independent GPU worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
gpu = [
  "torch==2.10.0",
  "diffusers==0.42.1",
  "transformers==5.22.0",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "huggingface-hub==2.4.0",
]
flux-lora = [
  "bitsandbytes==0.50.2",
  "peft==0.21.2",
  "sentencepiece==0.2.2",
  "protobuf==7.36.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
